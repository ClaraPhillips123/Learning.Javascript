<!DOCTYPE html>
<html>
    <head>
        <title>Task1</title>
    </head>
    <body>
        <input type="number" id="analysis" value="0">
        <input type="number" id="design" value="0">
        <input type="number" id="implementation" value="0">
        <input type="number" id="evaluation" value="0">
        <button onclick="addNumbers()">Add Numbers</button>
        <p id="result">Answer here!</p>
        <script>
            function addNumbers(){
                var number1 = parseFloat(document.getElementById("analysis").value);
                var number2 = parseFloat(document.getElementById("design").value);
                var number3 = parseFloat(document.getElementById("implementation").value);
                var number4 = parseFloat(document.getElementById("evaluation").value);
                var sum = number1 + number2 + number3 +number4;
                placetoput = document.getElementById("result");
                placetoput.innerHTML = "They add up to: "+sum;
            }
        </script>
    </body>
</html>
